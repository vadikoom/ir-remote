version: '3'

vars:
  IMAGE: 'ir-remote-image'

  TESTER_FQBN: 'arduino:avr:mega'
  TESTER_UPLOAD_TO_PORT: '/dev/tty.usbmodem14101'

  CONTROLLER_FQBN: esp8266:esp8266:generic:xtal=80,eesz=1M,ResetMethod=nodemcu,FlashMode=dio
  CONTROLLER_UPLOAD_TO_PORT: '/dev/cu.usbserial-1420'

tasks:
  setup:
    docker build . -t {{.IMAGE}}

  console:
    docker run --rm  --privileged -v $(pwd):/app -it -v $(pwd):/app {{.IMAGE}} /bin/bash

  build:tester: docker run --rm -v $(pwd):/app {{.IMAGE}} /bin/bash -c
        "cd /app/tester && arduino-cli compile --fqbn {{.TESTER_FQBN}} --output-dir /app/bin/tester --library /app/lib ."

  build:controller:
    silent: true
    env:
      FIRMWARE_WIFI_SSID: "{{.FIRMWARE_WIFI_SSID}}"
      FIRMWARE_WIFI_PASS: "{{.FIRMWARE_WIFI_PASS}}"
      FIRMWARE_REMOTE_HOST: "{{.FIRMWARE_REMOTE_HOST}}"
      FIRMWARE_SHARED_SECRET: "{{.FIRMWARE_SHARED_SECRET}}"
      CONTROLLER_FQBN: "{{.CONTROLLER_FQBN}}"
    cmds:
      - docker run --rm -v "{{.TASKFILE_DIR}}:/app"
          -e FIRMWARE_WIFI_SSID -e FIRMWARE_WIFI_PASS -e FIRMWARE_REMOTE_HOST
          -e FIRMWARE_SHARED_SECRET -e CONTROLLER_FQBN
          {{.IMAGE}} python3 /app/build-controller.py

  test:tester: docker run --rm -v $(pwd):/app {{.IMAGE}} /bin/bash -c
    "mkdir -p /app/bin/tests && cd /app/tester && g++ tests.cpp -I/app/lib -DUNIT_TEST -o /app/bin/tests/tester && /app/bin/tests/tester"

  ## Does not work in docker with MacOS host, so have to have arduino-cli installed on host anyway =(
  upload:tester: arduino-cli upload -p {{.TESTER_UPLOAD_TO_PORT}} --fqbn {{.TESTER_FQBN}} --input-dir ./bin/tester
  upload:controller: arduino-cli upload -p {{.CONTROLLER_UPLOAD_TO_PORT}} --fqbn {{.CONTROLLER_FQBN}} --input-dir ./bin/controller

  monitor: arduino-cli monitor -p {{.CONTROLLER_UPLOAD_TO_PORT}} --fqbn {{.CONTROLLER_FQBN}} --config 115200

  build:
    cmds:
    - task: build:tester
    - task: build:controller

  test:
    cmds:
      - task: test:security
      - task: test:tester

  test:security:
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/review:ro" {{.IMAGE}} /bin/bash -c
          'g++ -std=c++17 -g -fsanitize=address,undefined
          -I/review/firmware/tests/stubs -I/root/Arduino/libraries/ArduinoJson/src
          /review/firmware/tests/security.cpp /review/firmware/controller/src/monocypher/monocypher.c
          -o /tmp/security-tests && ASAN_OPTIONS=handle_segv=0:abort_on_error=1
          /tmp/security-tests /review/tgbot/testdata'

  clean:
    - rm -rf ./bin

