# The bot attaches the same keyboard to every response.
keyboard:
  - [ *nameOff, *nameOff30, *nameOff60 ]
  - [ *nameStatus, *nameDeh20, *nameCool20, *nameHeat28 ]

server:
  onlineMessage: "✅пульт працює"
  offlineMessage: "❌пульт не працює"

# Command scripts define appliance behavior; Rust executes the configured actions.
commands:
  off:
    trigger: { type: exactMessage, text: *nameOff }
    actions:
      - { type: sendRawCommand, bytes: *bytesOff}
      - { type: delay, seconds: 0, key: off } # this will cancel any pending off command
      - { type: respond, text: "вимкнено\n{statusMessage}"}

  offAfter30:
    trigger: { type: exactMessage, text: *nameOff30 }
    actions:
      - { type: respond, text: "заплановано вимкнення через 30 хвилин\n{statusMessage}" }
      - { type: delay, seconds: *duration30min, key: off }
      - { type: sendRawCommand, bytes: *bytesOff}
      - { type: respond, text: "вимкнено\n{statusMessage}" }

  offAfter60:
    trigger: { type: exactMessage, text: *nameOff60 }
    actions:
      - { type: respond, text: "заплановано вимкнення через 60 хвилин\n{statusMessage}" }
      - { type: delay, seconds: *duration60min, key: off }
      - { type: sendRawCommand, bytes: *bytesOff}
      - { type: respond, text: "вимкнено\n{statusMessage}" }

  status:
    trigger: { type: exactMessage, text: *nameStatus }
    actions:
      - { type: respond, text: "{statusMessage}" }

  Cool20:
    trigger: { type: exactMessage, text: *nameCool20 }
    actions:
      - { type: sendRawCommand, bytes: *bytesCool20 }
      - { type: respond, text: "увімкнено в режимі охолодження +20\n{statusMessage}"}

  Cool24:
    trigger: { type: exactMessage, text: *nameCool24 }
    actions:
      - { type: sendRawCommand, bytes: *bytesCool24 }
      - { type: respond, text: "увімкнено в режимі охолодження +24\n{statusMessage}"}

  Deh20:
    trigger: { type: exactMessage, text: *nameDeh20 }
    actions:
      - { type: sendRawCommand, bytes: *bytesDeh20 }
      - { type: respond, text: "увімкнено в режимі осушення +20\n{statusMessage}"}

  Heat28:
    trigger: { type: exactMessage, text: *nameHeat28 }
    actions:
      - { type: sendRawCommand, bytes: *bytesHeat28 }
      - { type: respond, text: "увімкнено в режимі обігріву +28\n{statusMessage}"}

handlers:
  genericError:
    actions:
      - { type: respond, text: "{error}" }

messages:
  commandNotFound: "❌Невідома команда. Використовуйте кнопки, щоб вибрати команду"
  telegramError: "❌Не вдалося надіслати повідомлення в Telegram"
  commandCanceled: "❌Команду скасовано"
  internalError: "❌Внутрішня помилка. Спробуйте пізніше"
  noResponseFromRc: "❌Пульт не відповідає на запити"
  canNotSendWhenOffline: "❌Не вдалося надіслати команду, бо пульт не працює"
