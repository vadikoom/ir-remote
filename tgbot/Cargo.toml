[package]
name = "tgbot"
version = "0.1.0"
edition = "2021"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
teloxide = "0.17.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio-util = { version = "0.7.20", features = ["codec", "net"] }
futures = "0.3.34"
serde_norway = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.3"
bytes = "1.12.1"
thiserror = "2.0.21"
serde_json = "1.0.154"
chacha20poly1305 = "0.10.1"
getrandom = "0.4"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
